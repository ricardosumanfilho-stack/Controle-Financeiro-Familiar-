<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="walletGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2" />

  <!-- Wallet Body -->
  <g filter="url(#shadow)">
    <!-- Back card / document sticking out -->
    <rect x="156" y="110" width="200" height="90" rx="16" fill="#38bdf8" />
    <rect x="180" y="130" width="120" height="10" rx="5" fill="#ffffff" fill-opacity="0.8" />
    
    <!-- Main Wallet Shape -->
    <rect x="96" y="160" width="320" height="230" rx="36" fill="url(#walletGrad)" />
    
    <!-- Wallet Flap / Top accent -->
    <path d="M 96,210 Q 256,230 416,210 L 416,196 Q 256,170 96,196 Z" fill="#cbd5e1" opacity="0.4" />

    <!-- Wallet Clasp / Pocket -->
    <path d="M 330,230 L 416,230 C 430,230 440,242 440,256 L 440,294 C 440,308 430,320 416,320 L 330,320 C 316,320 306,308 306,294 L 306,256 C 306,242 316,230 330,230 Z" fill="#1e293b" />
    
    <!-- Clasp Button -->
    <circle cx="355" cy="275" r="14" fill="#fbbf24" stroke="#f59e0b" stroke-width="3" />
    <circle cx="355" cy="275" r="6" fill="#ffffff" />

    <!-- Growth trend indicator inside wallet -->
    <path d="M 140,330 L 190,285 L 235,305 L 290,250" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 270,250 L 290,250 L 290,270" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Currency spark -->
  <circle cx="160" cy="235" r="8" fill="#10b981" />
  <circle cx="210" cy="235" r="8" fill="#3b82f6" />
</svg>
