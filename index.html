<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Gestão Financeira Familiar</title>
    <meta name="description" content="Sistema completo de gestão financeira familiar: separação por responsável (Ricardo e Ellen), Reserva de Emergência de 8 meses (R$ 55.200), Fundo da Nova Casa com 3 cenários, Reforma da casa com crédito a compensar no aluguel (Jan/2027), Fechamento Mensal com checklist, Central de Alertas, sincronização direta com Google Sheets & Drive e exportação completa em Excel." />
    <meta name="theme-color" content="#020617" />
    
    <!-- Mobile Web App & PWA tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finanças" />
    <meta name="application-name" content="Finanças" />
    
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('fin_family_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased min-h-screen selection:bg-emerald-500 selection:text-slate-950 transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
